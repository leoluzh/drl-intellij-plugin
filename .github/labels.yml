# Source of truth for repo labels, synced by .github/workflows/labels.yml
# (EndBug/label-sync). Path-based PR labels below are also applied
# automatically by .github/workflows/labeler.yml using .github/labeler.yml.

- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: enhancement
  color: "a2eeef"
  description: New feature or request

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: question
  color: "d876e3"
  description: Further information is requested

- name: good first issue
  color: "7057ff"
  description: Good for newcomers

- name: help wanted
  color: "008672"
  description: Extra attention is needed

- name: wontfix
  color: "ffffff"
  description: This will not be worked on

- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists

- name: invalid
  color: "e4e669"
  description: This doesn't seem right

- name: dependencies
  color: "0366d6"
  description: Pull requests that update a dependency file

- name: kotlin
  color: "7f52ff"
  description: Kotlin source changes

- name: resources
  color: "c5def5"
  description: Plugin resources (plugin.xml, icons, messages)

- name: build
  color: "fbca04"
  description: Gradle build / wrapper / config changes

- name: ci
  color: "1d76db"
  description: GitHub Actions / CI changes

- name: devbox
  color: "5319e7"
  description: Devbox / dev environment changes

- name: samples
  color: "bfd4f2"
  description: Sample .drl files

- name: needs-triage
  color: "ededed"
  description: Not yet triaged
